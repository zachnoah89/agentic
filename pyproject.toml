[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-sandbox-security"
version = "1.0.0"
description = "Agentic Cloud & GenAI Sandbox Security Suite — Deterministic MCP server, self-learning YAML knowledge base, and Red/Blue security skills for hardening ephemeral cloud environments."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Zach Noah"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "cloud-security",
    "ai-security",
    "genai",
    "terraform",
    "agentic-ai",
    "least-privilege",
    "gcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/zachnoah89/agentic"
Repository = "https://github.com/zachnoah89/agentic.git"
Issues = "https://github.com/zachnoah89/agentic/issues"

[project.scripts]
cloud-sandbox-security = "mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp*"]

[tool.setuptools.package-data]
"*" = ["kb/*.yaml", "assets/*.template", "assets/**/*.template"]
